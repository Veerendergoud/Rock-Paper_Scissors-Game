<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="game-container">

        <h1>🎮 Rock Paper Scissors</h1>
        <p class="subtitle">Choose your move!</p>

        <div class="score-board">

            <div>
                <span>👤 You</span>
                <strong id="playerScore">0</strong>
            </div>

            <div>
                <span>🤖 Computer</span>
                <strong id="computerScore">0</strong>
            </div>

        </div>

        <div class="result">

            <h2 id="resultText">Make your move!</h2>

            <p id="choicesText">
                You vs Computer
            </p>

        </div>

        <div class="choices">

            <button class="choice rock" onclick="playGame('Rock')">
                <span class="emoji">🪨</span>
                <span>Rock</span>
            </button>

            <button class="choice paper" onclick="playGame('Paper')">
                <span class="emoji">📄</span>
                <span>Paper</span>
            </button>

            <button class="choice scissors" onclick="playGame('Scissors')">
                <span class="emoji">✂️</span>
                <span>Scissors</span>
            </button>

        </div>

        <button class="reset-btn" onclick="resetGame()">
            🔄 Reset Game
        </button>

    </div>

    <script src="./script.js"></script>

</body>
</html>
